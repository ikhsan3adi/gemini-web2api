name: Build Windows Binary

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Windows executable
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${{ github.sha }}"
          fi
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/gemini-web2api-windows-${{ matrix.goarch }}.exe .
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            cp dist/gemini-web2api-windows-amd64.exe dist/gemini-web2api.exe
          fi

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-web2api-windows-${{ matrix.goarch }}
          path: dist/*.exe
          if-no-files-found: error
