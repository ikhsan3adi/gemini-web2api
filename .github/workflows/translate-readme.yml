name: Translate README

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Adding README translations
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: |-
            zh-CN
            zh-TW
            ar
            es
            pt
            ru
            vi
            hi
          FILES: |-
            README.md
